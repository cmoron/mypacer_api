services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - ./db/02-test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: mypacer-api-dev
    env_file: .env
    environment:
      # Override POSTGRES_HOST from .env: inside this container, the Postgres
      # service is reachable via the compose service name, not localhost.
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - .:/app  # Mount source code for hot reload
    command: uvicorn mypacer_api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
